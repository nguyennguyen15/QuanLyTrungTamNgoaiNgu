<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quản lý Trung tâm Ngoại ngữ{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('auth.index') }}">Quản lý Trung tâm Ngoại ngữ</a>
    <div class="navbar-nav ms-auto">
      {% if session.get('user_id') %}
        {% if session.get('role') == 'STUDENT' %}<a class="nav-link text-white" href="{{ url_for('student.profile') }}">Thông tin cá nhân</a>{% endif %}
        <span class="nav-link text-white">{{ session.get('role') }}</span>
        <a class="nav-link text-white" href="{{ url_for('auth.logout') }}">Đăng xuất</a>
      {% else %}
        <a class="nav-link text-white" href="{{ url_for('auth.login') }}">Đăng nhập</a>
        <a class="nav-link text-white" href="{{ url_for('auth.register') }}">Đăng ký</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
</body>
</html>
